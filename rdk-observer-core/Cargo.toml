[package]
name = "rdk-observer-core"
description = "Core observation types and behavior for rdk-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["sync", "fs", "time"] }
neli = { version = "0.7.4", default-features = false, features = ["async"] }
libc = "0.2.191"
procfs = "0.18.0"
rustix = { version = "1.1.5", features = ["time"] }
futures = "0.3.34"
anyhow.workspace = true
tracing.workspace = true
async-stream = "0.3.6"
